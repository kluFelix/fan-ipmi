# Fan IPMI Control Configuration
# Supports up to 16 sensors, each with its own fan curve

# IPMI connection settings
address: 123.123.123.123
user: ADMIN
password: ADMIN

# Temperature sources (up to 16)
# Format: /path/to/temp/file or gpu:<index>
temp_file1: /sys/class/thermal/thermal_zone0/temp
temp_file2: /sys/class/thermal/thermal_zone1/temp
temp_file3: /sys/class/thermal/thermal_zone2/temp
temp_file4: gpu:0

# History window in seconds (how far back to look for max temperature)
history_sec: 10

# Sensor to curve mapping
# sensorX_curve_id maps sensor X to curve Y (1-indexed)
sensor1_curve_id: 1
sensor2_curve_id: 2
sensor3_curve_id: 3
sensor4_curve_id: 4

# Fan speed curves - temperature (C) : percentage (0.0-1.0)
# Each curve can have different characteristics for different sensors

curve1:
    25: 0.0
    30: 0.2
    40: 0.4
    50: 0.6
    60: 0.8
    70: 1.0

curve2:
    25: 0.0
    35: 0.3
    50: 0.6
    65: 1.0

curve3:
    30: 0.0
    40: 0.2
    50: 0.4
    60: 0.7
    70: 1.0

curve4:
    30: 0.0
    45: 0.3
    60: 0.6
    75: 1.0
